name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DeYaz-Windows-x64
          - os: macos-14
            artifact: DeYaz-macOS-arm64
          - os: ubuntu-22.04
            artifact: DeYaz-Linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libpulse0 libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Validate sources and tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m py_compile deyaz_app.py api.py config.py filetranscribe.py i18n.py project_context.py work_modes.py
          python -m unittest discover -v

      - name: Build desktop app
        run: python -m PyInstaller --noconfirm --clean DeYaz.spec

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath dist/DeYaz.exe -DestinationPath DeYaz-Windows-x64.zip

      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/DeYaz.app DeYaz-macOS-arm64.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -C dist -czf DeYaz-Linux-x64.tar.gz DeYaz

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "DeYaz ${GITHUB_REF_NAME}"
